[project]
name = "aic-artworks"
version = "0.1.0"
description = "Curate my wall: the Art Institute of Chicago's public-domain collection, browsed with BehaviorGPT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Not on PyPI yet; pinned to the SDK commit this app was built against.
    "behaviorgpt @ git+https://github.com/Unbox-AI/behaviorgpt.git@4705b317849e3d6dc290bce8ea05fa846cf1e2a1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.0.0",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = ["ruff>=0.16.2"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["art_map", "build_catalog"]
